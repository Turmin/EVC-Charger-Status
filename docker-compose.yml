services:
  evc-charger-status:
    image: ${IMAGE_REF:?Set IMAGE_REF to the published GHCR image}
    restart: unless-stopped
    env_file: .env
    environment:
      STATUS_DB_PATH: /data/status.sqlite3
    ports:
      - "127.0.0.1:${EVC_PORT:-8001}:8000"
    volumes:
      - ./config.json:/app/config.json:ro
      - evc-status-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s

volumes:
  evc-status-data:
